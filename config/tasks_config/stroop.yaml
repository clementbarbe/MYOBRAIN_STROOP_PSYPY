task_name: stroop
display_name: Stroop

# Fixation ajoutée après la dernière fixation du TSV, uniquement pour le RUN.
final_rest_duration: 10.0

stimulus:
  word_height: 0.15

colors:
  rouge: [1.0, -1.0, -1.0]
  bleu: [-1.0, -1.0, 1.0]
  vert: [-1.0, 0.8, -1.0]

response_keys_pc: {rouge: left, bleu: down, vert: right}
response_keys_fmri: {rouge: b, bleu: y, vert: g}

# Seuil pratique de vérification, ajustable lors du pilotage.
training:
  accuracy_threshold: 0.8

ttl_codes:
  stim_congruent: 110
  stim_incongruent: 111
  stim_neutral: 112
  response_correct: 160
  response_incorrect: 161

# L'ordre, les onsets, les durées et les fixations viennent des TSV.
designs:
  A: {name: 'Stroop A', paradigm: event, blocks: [{condition: mixed, n_trials: 75}]}
  B: {name: 'Stroop B', paradigm: event, blocks: [{condition: mixed, n_trials: 75}]}
  C: {name: 'Stroop C', paradigm: event, blocks: [{condition: mixed, n_trials: 75}]}
  D: {name: 'Stroop D', paradigm: event, blocks: [{condition: mixed, n_trials: 75}]}
  training: {name: 'Entraînement Stroop', paradigm: event, blocks: [{condition: mixed, n_trials: 45}]}
